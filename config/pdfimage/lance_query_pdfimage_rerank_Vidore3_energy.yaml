bench:
  dataset: vidore
  # subdataset: vidore_v3_computer_science
  # subdataset: vidore_v3_finance_en
  subdataset: vidore_v3_energy
  dataset_basepath: /upb/users/a/amirk/scratch/UPB_phd/RAG
  type: image_rerank
  preprocessing:
    chunk_overlap: 0
    chunk_size: 512
    chunktype: length
    dataset_ratio: 0.001 # defines the data set size, what fraction of the data set items to be downloaded(only for arxiv)
rag:
  action:
    preprocess: false
    embedding: false
    insert: false
    build_index: false
    reranking: true
    retrieval: true
    generation: true
    evaluate: false
  build_index:
    index_type: IVF_HNSW_SQ
    metric_type: L2
  embedding:
    device: cuda:0 
    # device: cpu 
    sentence_transformers_name: vidore/colpali-v1.2
    batch_size: 1024
    embedding_framework: sentence_transformers
    model: nomic-ai/nomic-embed-text-v2-moe
    store: false
    load: false
  insert:
    batch_size: 512
    collection_name: ''
    drop_previous_collection: false
  generation:
    device: cuda:0
    dont_answer: false 
    model: Qwen/Qwen2-VL-7B-Instruct
  retrieval:
    question_num: 4
    retrieval_batch_size: 1
    top_k: 10
    device: cuda:0
    max_rerank_worker: 1
    m_of_top_k: 0 # default=0
  reranking:
    # rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2 
    rerank_model: None
    top_n: 4
    # device: cuda:0 
    device: cpu
  pipeline:
    batch_size: 1
run_name: default_run
sys:
  devices:
    cpu: cpu
    gpu_count: 1
    gpus:
    - cuda:0
  log:
    metrics_log: ./log/default_run.log
  vector_db:
    collection_name: 'vidore_v3_energy' 
    # db_path: /mnt/data1/yuanxu4/lancedb # local path for lance db
    db_path: /upb/users/a/amirk/scratch/UPB_phd/RAG/RAGPerf/RAGPerf_dbs/lance_pdfimage # local path for lance db
    db_token: 
    drop_previous_collection: false
    type: lancedb

bench:
  dataset: common-pile/arxiv_papers
  type: image_rerank
  preprocessing:
    chunk_overlap: 0
    chunk_size: 512
    chunktype: length
    dataset_ratio: 0.0001
rag:
  action:
    preprocess: false
    embedding: false
    insert: false
    build_index: false
    reranking: true
    retrieval: true
    generation: true
    evaluate: false
  build_index:
    index_type: IVF_HNSW_SQ
    metric_type: L2
  embedding:
    device: cuda:0  
    sentence_transformers_name: vidore/colpali-v1.2
    batch_size: 1024
    embedding_framework: sentence_transformers
    model: nomic-ai/nomic-embed-text-v2-moe
    store: false
    load: false
  insert:
    batch_size: 512
    collection_name: ''
    drop_previous_collection: false
  generation:
    device: cuda:0
    model: Qwen/Qwen2-VL-7B-Instruct
  retrieval:
    question_num: 4
    retrieval_batch_size: 1
    top_k: 100
  reranking:
    # rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2 
    rerank_model: None
    top_n: 64
    device: cuda:0 # not used actually as re-ranker uses dot product
  pipeline:
    batch_size: 1
run_name: default_run
sys:
  devices:
    cpu: cpu
    gpu_count: 1
    gpus:
    - cuda:0
  log:
    metrics_log: ./log/default_run.log
  vector_db:
    collection_name: 'lance_image_test' 
    # db_path: /mnt/data1/yuanxu4/lancedb # local path for lance db
    db_path: /local/amirk/RAGPerf/RAGPerf_dbs/lance_pdfimage # local path for lance db
    db_token: 
    drop_previous_collection: false
    type: lancedb
